services:
  postgres:
    image: postgres:16-alpine
    container_name: deadlock-meta-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deadlock_meta
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
